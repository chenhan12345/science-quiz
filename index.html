<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中自然科理化 互動語音解題動畫・數位學習大廳</title>
    <style>
        :root {
            --bg-main: #0b1120;
            --bg-card: #1e293b;
            --bg-card-hover: #26354a;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px 80px 20px;
        }
        .header {
            max-width: 800px;
            margin: 0 auto 32px auto;
            text-align: center;
        }
        .main-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.35);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: var(--text-sub);
            font-size: 1.05rem;
            max-width: 620px;
            margin: 0 auto;
        }

        /* Filter Controls */
        .filter-section {
            max-width: 720px;
            margin: 0 auto 32px auto;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(8px);
        }
        .filter-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #e2e8f0;
            min-width: 82px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
        }
        .filter-btn {
            background: #1e293b;
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 7px 18px;
            border-radius: 9999px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background: #334155;
            color: #fff;
            transform: translateY(-1px);
        }
        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        /* Grid */
        .quiz-grid {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .quiz-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .quiz-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .icon-bubble {
            font-size: 2rem;
            background: rgba(255, 255, 255, 0.05);
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
        }
        .badge-grade {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .badge-sub {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .card-scope {
            font-size: 0.92rem;
            color: var(--text-sub);
            margin-bottom: 22px;
        }
        .card-url-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            font-size: 0.88rem;
            font-family: monospace;
            color: #94a3b8;
        }
        .url-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-copy {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-family: inherit;
            transition: all 0.15s;
        }
        .btn-copy:hover {
            background: var(--primary);
            color: #fff;
        }
        .card-actions {
            display: flex;
            gap: 10px;
        }
        .btn-launch {
            flex: 1;
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }
        .btn-launch:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.45);
        }
        .btn-launch .arrow {
            transition: transform 0.2s;
        }
        .btn-launch:hover .arrow {
            transform: translateX(4px);
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 48px 24px;
            background: var(--bg-card);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            color: var(--text-sub);
        }
        .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            z-index: 9999;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="main-badge">🔬 國中自然科理化・數位學習大廳</div>
        <h1>互動語音解題動畫</h1>
        <p class="subtitle">點擊進入測驗動畫，或點擊按鈕複製專屬短網址分享給學生複習</p>
    </header>

    <div class="filter-section">
        <!-- 年段分類 -->
        <div class="filter-row">
            <span class="filter-label">🎓 年段分類</span>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="grade" data-val="all">全部年級</button>
                <button class="filter-btn" data-filter="grade" data-val="grade7">七年級</button>
                <button class="filter-btn" data-filter="grade" data-val="grade8">八年級</button>
                <button class="filter-btn" data-filter="grade" data-val="grade9">九年級</button>
            </div>
        </div>
        <!-- 教材版本 -->
        <div class="filter-row">
            <span class="filter-label">📖 教材版本</span>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="version" data-val="all">全部版本</button>
                <button class="filter-btn" data-filter="version" data-val="nani">南一版</button>
                <button class="filter-btn" data-filter="version" data-val="jinan">金安版</button>
                <button class="filter-btn" data-filter="version" data-val="quiz">小考卷</button>
            </div>
        </div>
    </div>

    <main class="quiz-grid" id="quizGrid">
        
        <div class="quiz-card" data-grade="grade8" data-version="nani" data-chapter="ch3">
            <div class="card-header">
                <span class="icon-bubble">🌊</span>
                <div class="badges">
                    <span class="badge badge-grade">八年級理化</span>
                    <span class="badge" style="background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4);">南一版 第 6 回</span>
                    <span class="badge badge-sub">第3章 波動與聲音</span>
                </div>
            </div>
            <h3 class="card-title">南一自然3 第6回：§3-1～§3-2 波動與聲音的世界</h3>
            <p class="card-scope">波速公式、橫波縱波、傳聲介質（全卷 30 題動態語音解題動畫）</p>
            <div class="card-url-box">
                <span class="url-text">/nani-ch3-waves.html</span>
                <button class="btn-copy" onclick="copyLink('nani-ch3-waves.html', this)">📋 複製網址</button>
            </div>
            <div class="card-actions">
                <a href="nani-ch3-waves.html" class="btn-launch">
                    <span>進入測驗解題動畫</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>
        
        <div class="empty-state" id="emptyState">
            <div class="icon">📚</div>
            <h3>該分類教材即將上線</h3>
            <p>老師正在準備最新進度之互動解題動畫，敬請期待！</p>
        </div>
    </main>

    <div id="toast">📋 專屬網址已複製到剪貼簿！可直接貼在 LINE 或 Google Classroom</div>

    <script>
        const baseUrl = window.location.href.split('?')[0].split('#')[0];
        const rootUrl = baseUrl.endsWith('/') ? baseUrl : baseUrl.substring(0, baseUrl.lastIndexOf('/') + 1);

        function copyLink(slug, btn) {
            const fullUrl = rootUrl + slug;
            navigator.clipboard.writeText(fullUrl).then(() => {
                showToast("📋 已複製網址：" + fullUrl);
                const origText = btn.innerText;
                btn.innerText = "✓ 已複製";
                setTimeout(() => btn.innerText = origText, 2000);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Combined Filter Logic (Grade + Version)
        let selectedGrade = 'all';
        let selectedVersion = 'all';

        const filterButtons = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.quiz-card');
        const emptyState = document.getElementById('emptyState');

        function applyFilters() {
            let visibleCount = 0;
            cards.forEach(card => {
                const matchGrade = (selectedGrade === 'all') || (card.getAttribute('data-grade') === selectedGrade);
                const matchVersion = (selectedVersion === 'all') || (card.getAttribute('data-version') === selectedVersion);

                if (matchGrade && matchVersion) {
                    card.style.display = 'flex';
                    visibleCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            if (visibleCount === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }
        }

        filterButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const filterType = this.getAttribute('data-filter');
                const val = this.getAttribute('data-val');

                document.querySelectorAll(`.filter-btn[data-filter="${filterType}"]`).forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                if (filterType === 'grade') selectedGrade = val;
                if (filterType === 'version') selectedVersion = val;

                applyFilters();
            });
        });
    </script>
</body>
</html>
