<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中自然科理化 互動語音解題動畫專區</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .container {
            max-width: 760px;
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 36px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(51, 65, 85, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }
        .card:hover {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .card-info h3 {
            font-size: 1.1rem;
            color: #f1f5f9;
            margin-bottom: 4px;
        }
        .card-info span {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .card-btn {
            background: #2563eb;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">國中自然科・理化隨堂小考</span>
            <h1>互動語音解題動畫目錄專區</h1>
            <p class="subtitle">點選下方單元即可開啟動畫學習教材（所有單元均已受 PageCrypt 安全保護）</p>
        </div>
        <div class="grid">
            <a class="card" href="unit4-3_光的折射與透鏡.html">
                <div class="card-info">
                    <h3>🔍 4-3 光的折射與透鏡</h3>
                    <span>透鏡成像規律、光線折射圖解與語音精解</span>
                </div>
                <div class="card-btn">開始複習 →</div>
            </a>
            <a class="card" href="unit5-2_熱量與比熱.html">
                <div class="card-info">
                    <h3>🔥 5-2 熱量與比熱</h3>
                    <span>H=m·s·ΔT 計算、吸放熱平衡圖表解析</span>
                </div>
                <div class="card-btn">開始複習 →</div>
            </a>
            <a class="card" href="unit5-3_5-4_熱對物質與傳播.html">
                <div class="card-info">
                    <h3>🌡️ 5-3 熱對物質的影響 ＆ 5-4 熱的傳播</h3>
                    <span>熱膨脹、熱傳導、對流與輻射綜合題型分析</span>
                </div>
                <div class="card-btn">開始複習 →</div>
            </a>
            <a class="card" href="unit6-1_6-2_元素與純物質.html">
                <div class="card-info">
                    <h3>🧪 6-1 ＆ 6-2 元素與純物質</h3>
                    <span>元素符號、金屬與非金屬特性、純物質觀念測驗</span>
                </div>
                <div class="card-btn">開始複習 →</div>
            </a>
        </div>
    </div>
</body>
</html>
