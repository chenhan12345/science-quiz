<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>🔐 本頁面受密碼保護 - PageCrypt</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #334155;
        }
        
        #dialogWrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99999;
            padding: 20px;
        }
        
        #mainDialog {
            width: 100%;
            max-width: 440px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #ffffff;
            overflow: hidden;
            text-align: left;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #dialogText {
            color: #0f172a;
            background: #f8fafc;
            padding: 22px 28px 16px 28px;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        #passArea {
            padding: 28px;
            background-color: #ffffff;
        }
        
        #passwordPrompt {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #475569;
        }
        
        #pass {
            width: 100%;
            height: 48px;
            padding: 10px 16px;
            font-size: 1.25rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
            letter-spacing: 2px;
        }
        
        #pass:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        
        #actionRow {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #messageWrapper {
            flex: 1;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .notifyText {
            display: none;
        }
        
        #invalidPass {
            color: #ef4444;
        }
        
        #trycatcherror {
            color: #ef4444;
        }
        
        #success {
            color: #10b981;
        }
        
        #submitPass {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        #submitPass:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        #submitPass:active {
            transform: translateY(1px);
        }
        
        #contentFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        #attribution {
            position: absolute;
            bottom: 16px;
            width: 100%;
            text-align: center;
            font-size: 0.82rem;
            color: #94a3b8;
            z-index: 100000;
        }
        
        #attribution a {
            color: #cbd5e1;
            text-decoration: underline;
        }

        .error-box {
            display: none;
            padding: 16px 28px;
            background: #fef2f2;
            color: #b91c1c;
            border-top: 1px solid #fee2e2;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
  </head>
  <body>
    <iframe id="contentFrame" frameBorder="0" allowfullscreen></iframe>
    <div id="dialogWrap">
        <div id="mainDialog">
            <div id="dialogText">
                <span>🔐</span>
                <span>此教材受密碼保護</span>
            </div>
            <div id="passArea">
                <p id="passwordPrompt">請輸入通關密碼</p>
                <input id="pass" type="password" name="pass" autofocus placeholder="請輸入密碼...">
                <div id="actionRow">
                    <div id="messageWrapper">
                        <span id="invalidPass" class="notifyText">❌ 密碼錯誤，請重新輸入</span>
                        <span id="trycatcherror" class="notifyText">⚠️ 發生錯誤，請稍後再試</span>
                        <span id="success" class="notifyText">✅ 解密成功！正在開啟...</span>
                    </div>
                    <button id="submitPass" type="button">解密開啟</button>
                </div>
            </div>
            <div id="securecontext" class="error-box">
                ⚠️ 本加密機制需在安全連線（HTTPS 或 localhost）下運行。請透過 GitHub Pages (HTTPS) 開啟此頁面。
            </div>
            <div id="nocrypto" class="error-box">
                ⚠️ 您的瀏覽器版本過舊，未支援 Web Cryptography API，請使用最新版 Chrome、Edge 或 Safari 開啟。
            </div>
        </div>
    </div>
    <div id="attribution">
        Protected with PageCrypt (AES-256-GCM)

        var submitPass = document.getElementById('submitPass');
        var passEl = document.getElementById('pass');
        var invalidPassEl = document.getElementById('invalidPass');
        var trycatcherror = document.getElementById('trycatcherror');
        var successEl = document.getElementById('success');
        var contentFrame = document.getElementById('contentFrame');
        var dialogWrap = document.getElementById('dialogWrap');
        
        // Sanity checks
        if (pl === "") {
            submitPass.disabled = true;
            passEl.disabled = true;
            alert("This page is meant to be used with the encryption tool. It doesn't work standalone.");
            return;
        }

        if (!window.isSecureContext && window.location.protocol !== "file:") {
            document.querySelector("#passArea").style.display = "none";
            document.querySelector("#securecontext").style.display = "block";
            return;
        }

        if (!window.crypto || !window.crypto.subtle) {
            document.querySelector("#passArea").style.display = "none";
            document.querySelector("#nocrypto").style.display = "block";
            return;
        }
        
        function str2ab(str) {
            var ustr = atob(str);
            var buf = new ArrayBuffer(ustr.length);
            var bufView = new Uint8Array(buf);
            for (var i=0, strLen=ustr.length; i < strLen; i++) {
                bufView[i] = ustr.charCodeAt(i);
            }
            return bufView;
        }

        async function deriveKey(salt, password) {
            const encoder = new TextEncoder();
            const baseKey = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                'PBKDF2',
                false,
                ['deriveKey'],
            );
            return await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                true,
                ['decrypt'],
            );
        }
        
        async function doSubmit(evt) {
            invalidPassEl.style.display = "none";
            trycatcherror.style.display = "none";
            submitPass.disabled = true;
            passEl.disabled = true;

            let iv, ciphertext, key;
            
            try {
                var unencodedPl = str2ab(pl);
                const salt = unencodedPl.slice(0, 32);
                iv = unencodedPl.slice(32, 32 + 16);
                ciphertext = unencodedPl.slice(32 + 16);

                key = await deriveKey(salt, passEl.value);
            } catch (e) {
                trycatcherror.style.display = "inline";
                console.error(e);
                submitPass.disabled = false;
                passEl.disabled = false;
                return;
            }

            try {
                const decryptedArray = new Uint8Array(
                    await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext)
                );

                let decrypted = new TextDecoder().decode(decryptedArray);

                if (decrypted === "") throw "No data returned";

                const basestr = '<base href="." target="_top">';
                const anchorfixstr = `
                    <script>
                        Array.from(document.links).forEach((anchor) => {
                            const href = anchor.getAttribute("href");
                            if (href && href.startsWith("#")) {
                                anchor.addEventListener("click", function(e) {
                                    e.preventDefault();
                                    const targetId = this.getAttribute("href").substring(1);
                                    const targetEl = document.getElementById(targetId);
                                    if (targetEl) targetEl.scrollIntoView();
                                });
                            }
                        });
                    <\/script>
                `;
                
                if (decrypted.includes("<head>")) decrypted = decrypted.replace("<head>", "<head>" + basestr);
                else if (decrypted.includes("<!DOCTYPE html>")) decrypted = decrypted.replace("<!DOCTYPE html>", "<!DOCTYPE html>" + basestr);
                else decrypted = basestr + decrypted;

                if (decrypted.includes("</body>")) decrypted = decrypted.replace("</body>", anchorfixstr + '</body>');
                else if (decrypted.includes("</html>")) decrypted = decrypted.replace("</html>", anchorfixstr + '</html>');
                else decrypted = decrypted + anchorfixstr;
                
                contentFrame.srcdoc = decrypted;
                
                successEl.style.display = "inline";
                setTimeout(function() {
                    dialogWrap.style.display = "none";
                }, 600);
            } catch (e) {
                invalidPassEl.style.display = "inline";
                passEl.value = "";
                submitPass.disabled = false;
                passEl.disabled = false;
                passEl.focus();
                console.error(e);
                return;
            }
        }
        
        submitPass.onclick = doSubmit;
        passEl.onkeypress = function(e){
            if (!e) e = window.event;
            var keyCode = e.keyCode || e.which;
            invalidPassEl.style.display = "none";
            if (keyCode == 13){
              doSubmit();
              return false;
            }
        }
    })();
    </script>
